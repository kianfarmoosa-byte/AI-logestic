<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اطلس ترانزیت و گذرگاه‌های مرزی ایران</title>
    <meta name="description" content="سامانه هوشمند تحلیل شبکه راه‌ها، گذرگاه‌های مرزی، زنجیره تأمین کالا و مسیریابی چندوجهی منتهی به ایران با نقشه پایه منبع‌باز OpenStreetMap و دسترسی به داده‌های زنده جوی، ارزی و تجاری" />
    <meta property="og:title" content="اطلس ترانزیت و گذرگاه‌های مرزی ایران" />
    <meta property="og:description" content="سامانه هوشمند تحلیل شبکه راه‌ها، گذرگاه‌های مرزی، زنجیره تأمین کالا و مسیریابی چندوجهی منتهی به ایران با نقشه پایه منبع‌باز OpenStreetMap و دسترسی به داده‌های زنده" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      #boot-error {
        display: none;
        margin: 24px auto;
        max-width: 720px;
        padding: 16px;
        border-radius: 14px;
        border: 1px solid rgba(244, 63, 94, 0.45);
        background: #0b1220;
        color: #e8ecf3;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        font-size: 12px;
        line-height: 1.9;
        direction: rtl;
      }
      #boot-error pre {
        direction: ltr;
        text-align: left;
        margin-top: 10px;
        padding: 10px;
        border-radius: 10px;
        background: rgba(2, 6, 23, 0.8);
        color: #fcd34d;
        font-size: 11px;
        white-space: pre-wrap;
        overflow: auto;
        max-height: 260px;
      }
    </style>
    <script>
      // نمایش و گزارش خطاهای پیش از سوارشدن React (مثل خطای بارگذاری ماژول) به‌جای صفحهٔ خالی
      (function () {
        // نویز شناخته‌شده گزارش نمی‌شود: سوکت HMR که پراکسی پیش‌نمایش تونل نمی‌کند
        var NOISE = [
          /WebSocket closed without opened/i,
          /@vite\/client/i,
          /\[vite\]\s+connect/i,
          /failed to connect to websocket/i,
        ];
        function isNoise(message, stack) {
          var text = (message || '') + '\n' + (stack || '');
          return NOISE.some(function (pattern) { return pattern.test(text); });
        }
        function show(message, stack) {
          try {
            var box = document.getElementById('boot-error');
            if (!box) {
              box = document.createElement('div');
              box.id = 'boot-error';
              document.body.appendChild(box);
            }
            box.style.display = 'block';
            box.innerHTML =
              '<strong>خطای بارگذاری برنامه</strong><div>برنامه نتوانست اجرا شود. متن خطا برای بررسی ثبت شد:</div><pre></pre>';
            box.querySelector('pre').textContent = message + (stack ? '\n\n' + stack : '');
            fetch('/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: message, stack: stack || null, source: 'boot' }),
            }).catch(function () {});
          } catch (ignored) {}
        }
        window.addEventListener('error', function (event) {
          var message = event.message || 'خطای ناشناخته';
          var stack = event.error && event.error.stack;
          if (isNoise(message, stack)) return;
          show(message, stack);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = reason instanceof Error ? reason.message : String(reason);
          var stack = reason instanceof Error ? reason.stack : null;
          if (isNoise(message, stack)) return;
          show(message, stack);
        });
      })();
    </script>
  </head>
  <body class="bg-[#070a10] text-[#e8ecf3] font-['Vazirmatn',sans-serif] antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
