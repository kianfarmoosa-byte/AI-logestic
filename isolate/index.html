    <style>#boot-error{color:#e8ecf3;direction:rtl;background:#0b1220;border:1px solid #f43f5e73;border-radius:14px;max-width:720px;margin:24px auto;padding:16px;font-family:Vazirmatn,system-ui,sans-serif;font-size:12px;line-height:1.9;display:none}#boot-error pre{text-align:left;color:#fcd34d;white-space:pre-wrap;direction:ltr;background:#020617cc;border-radius:10px;max-height:260px;margin-top:10px;padding:10px;font-size:11px;overflow:auto}</style>
    <script>
      // نمایش و گزارش خطاهای پیش از سوارشدن React (مثل خطای بارگذاری ماژول) به‌جای صفحهٔ خالی
      (function () {
        function show(message, stack) {
          try {
            var box = document.getElementById('boot-error');
            if (!box) {
              box = document.createElement('div');
              box.id = 'boot-error';
              document.body.appendChild(box);
            }
            box.style.display = 'block';
            box.innerHTML =
              '<strong>خطای بارگذاری برنامه</strong><div>برنامه نتوانست اجرا شود. متن خطا برای بررسی ثبت شد:</div><pre></pre>';
            box.querySelector('pre').textContent = message + (stack ? '\n\n' + stack : '');
            fetch('/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: message, stack: stack || null, source: 'boot' }),
            }).catch(function () {});
          } catch (ignored) {}
        }
        window.addEventListener('error', function (event) {
          show(event.message || 'خطای ناشناخته', event.error && event.error.stack);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          show(
            reason instanceof Error ? reason.message : String(reason),
            reason instanceof Error ? reason.stack : null
          );
        });
      })();
    </script>
